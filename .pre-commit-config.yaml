# Install with `make hooks`. The hooks mirror the CI gates, so a clean commit is
# a passing build.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        # Neither the dataset nor a model artifact belongs in git history.
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        files: ^(src|scripts)/
        additional_dependencies:
          - pydantic>=2.7
          - pandas-stubs
          - types-PyYAML

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        # Notebook outputs are regenerated by running the notebook. Committing
        # them makes every diff unreadable and inflated the original repo's
        # notebook to 2.3 MB of embedded PNGs.
        files: \.ipynb$

  - repo: local
    hooks:
      - id: no-dataset-commits
        name: block dataset and artifact commits
        entry: >-
          bash -c 'files=$(git diff --cached --name-only
          | grep -E "^(data/(raw|interim|processed)/[^.]|artifacts/[^R.])" || true);
          if [ -n "$files" ]; then
          echo "Refusing to commit generated data or artifacts:"; echo "$files";
          echo "They are reproducible via: make data && make train"; exit 1; fi'
        language: system
        pass_filenames: false

      - id: pytest-fast
        name: pytest (no dataset required)
        entry: uv run pytest -q -m "not slow and not requires_dataset"
        language: system
        pass_filenames: false
        stages: [pre-push]
