[project]
name = "term-deposit-propensity"
version = "1.0.0"
description = "Pre-call propensity scoring for bank term-deposit telemarketing campaigns, with an out-of-time evaluation protocol."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Christian Camilo Otero" }]
keywords = ["machine-learning", "propensity-modelling", "imbalanced-classification", "mlops"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "xgboost>=2.1",
]

[project.optional-dependencies]
# Plot rendering for `scripts/evaluate.py --figures` and the notebooks.
viz = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
# Global/local explanations. Heavy and version-sensitive, therefore opt-in.
explain = [
    "shap>=0.45",
]
# Optional experiment-tracking backend. The default JSONL tracker needs no extras.
mlflow = [
    "mlflow>=2.14",
]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[project.scripts]
term-deposit = "term_deposit.cli:app"

[project.urls]
Repository = "https://github.com/criscotero/banking-marketing-data-eda"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/term_deposit"]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "PD",   # pandas-vet
    "NPY",  # numpy-specific rules
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "T20",  # flake8-print
]
ignore = [
    "D203",    # incompatible with D211
    "D213",    # incompatible with D212
    "ANN401",  # allow `Any` in narrow, documented places
    "PD901",   # `df` is an accepted name in this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "ANN201", "ANN001", "ARG001"]
"scripts/**" = ["T20"]  # scripts intentionally write to stdout via typer.echo

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
# 3.12 rather than the 3.11 floor: numpy's bundled stubs use `type` statements,
# which mypy refuses to parse in 3.11 mode. Runtime support for 3.11 is covered
# by the test matrix in CI instead.
python_version = "3.12"
files = ["src", "scripts", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "xgboost.*", "shap.*", "seaborn.*", "matplotlib.*", "joblib.*", "mlflow.*"]
ignore_missing_imports = true

# Tests are checked, but not for annotation completeness: a pytest function's
# signature is fixture wiring, not an interface, and annotating it adds noise
# without catching anything. Real type errors in test bodies are still reported.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "slow: tests that train real models on the full dataset (deselect with '-m \"not slow\"')",
    "requires_dataset: tests that need data/raw/bank-additional-full.csv to be present",
]
filterwarnings = ["error::DeprecationWarning:term_deposit.*"]

[tool.coverage.run]
source = ["src/term_deposit"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
