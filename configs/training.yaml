# Training settings. Layer on top of base.yaml:
#   uv run python scripts/train.py --config configs/base.yaml --config configs/training.yaml
#
# Every candidate below shares one preprocessing definition and one split, so the
# comparison measures the estimator and nothing else. Hyperparameters live here
# rather than in Python: changing a model is a config diff, reviewable on its own.

training:
  models:
    # The reference every other model has to beat. A propensity model that cannot
    # outperform "call everyone in a random order" has no business being deployed,
    # and the original notebook had no such reference point.
    - name: baseline_prior
      estimator: dummy
      params:
        strategy: prior
      balance_strategy: none

    # Interpretable linear baseline. Under the out-of-time protocol this is a
    # genuinely competitive model, not a formality.
    - name: logistic_regression
      estimator: logistic_regression
      params:
        max_iter: 2000
        solver: lbfgs
        C: 1.0
      balance_strategy: class_weight

    - name: random_forest
      estimator: random_forest
      params:
        n_estimators: 400
        max_depth: 12
        min_samples_leaf: 20
      balance_strategy: class_weight

    - name: gradient_boosting
      estimator: gradient_boosting
      params:
        n_estimators: 300
        learning_rate: 0.05
        max_depth: 3
        subsample: 0.9
      balance_strategy: none

    - name: xgboost
      estimator: xgboost
      params:
        n_estimators: 400
        learning_rate: 0.05
        max_depth: 4
        subsample: 0.9
        colsample_bytree: 0.9
        min_child_weight: 5
        reg_lambda: 1.0
      balance_strategy: scale_pos_weight

  calibration:
    # Class weighting shifts the probability scale upwards. That is harmless for
    # ranking and fatal for expected-value decisions, so probabilities are
    # remapped on the validation split only.
    enabled: true
    method: isotonic

  # Random k-fold inside the training window. Measures stability, not temporal
  # generalisation — that is what the backtest is for.
  cross_validate: true
  cv_folds: 5

  # Retrain on all prior months, score the next, repeat. The closest offline
  # simulation of monthly retraining and the basis for model selection.
  backtest: true
  backtest_periods: 9
  backtest_min_rows: 100

  random_state: 42
  n_jobs: -1
